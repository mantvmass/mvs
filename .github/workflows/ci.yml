name: MVS Compiler CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # install nasm (the assembler); clang/llvm is already provided on the windows runner
      - name: Install NASM
        run: choco install nasm -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      # build the compiler with clang (source list matches the Makefile:
      # includes generic.c + arch/common.c + arch/x86_64/win.c)
      - name: Build compiler
        run: clang -Wall -Wextra -D_CRT_SECURE_NO_WARNINGS -Wno-deprecated-declarations -Isrc src/main.c src/lexer.c src/ast.c src/parser.c src/module.c src/generic.c src/diag.c src/codegen.c src/arch/common.c src/arch/x86_64/win.c -o mvs.exe

      # run the full test suite: golden output diffs, compile-only, C interop (both
      # directions, linked with clang and diffed), and compile-fail (expected-error)
      # tests; see tests/run.ps1
      - name: Run test suite
        run: powershell -ExecutionPolicy Bypass -File tests/run.ps1

