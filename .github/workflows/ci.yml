name: CI

# GitHub CI is the PRIMARY verification platform for MVS: not every OS/arch can
# run locally, so every push must prove the compiler builds warning-free and the
# full golden test suites pass on every supported target.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Windows host, win64 target: build with clang, run the complete suite
  # (golden run-pass diffs, compile-only, C interop linked with clang,
  # elf64 cross-assembly, compile-fail expected errors)
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NASM
        run: choco install nasm -y

      - name: Add NASM to PATH
        run: echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build compiler (clang, warnings are errors)
        run: clang -Wall -Wextra -Werror -D_CRT_SECURE_NO_WARNINGS -Wno-deprecated-declarations -Isrc src/main.c src/lexer.c src/ast.c src/parser.c src/module.c src/generic.c src/diag.c src/codegen.c src/arch/common.c src/arch/x86_64/win.c src/arch/x86_64/sysv.c src/arch/arm64/linux.c -o mvs.exe

      - name: Run test suite
        run: powershell -ExecutionPolicy Bypass -File scripts/test.ps1

      - name: Run the built-in runner (mvs test)
        run: .\mvs.exe test

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: mvs-windows-x86_64
          path: |
            mvs.exe
            std/
            core/

  # Linux host, elf64 target: build natively with gcc, then compile, link, RUN
  # every runnable example and diff stdout against the same goldens the Windows
  # job uses; also proves --nostd objects are self-contained and ld-linkable
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build compiler (gcc, warnings are errors)
        run: gcc -Wall -Wextra -Werror -Isrc src/main.c src/lexer.c src/ast.c src/parser.c src/module.c src/generic.c src/diag.c src/codegen.c src/arch/common.c src/arch/x86_64/win.c src/arch/x86_64/sysv.c src/arch/arm64/linux.c -o mvs

      - name: Run ELF64 test suite (compile, link, run, diff goldens; incl. freestanding)
        run: sh scripts/test_elf_ci.sh

      - name: Run the built-in runner (mvs test)
        run: ./mvs test

      # Differential testing: the same program in MVS and in C must print
      # byte-identical output. gcc is the reference implementation, so a
      # mismatch means MVS generated WRONG code (goldens only prove nothing
      # changed; this proves the result is right).
      - name: Differential test against the C reference
        run: sh scripts/difftest.sh elf64

      # Exhaustive rather than sampled: every type carried through every
      # context (local, global, param, return, field, array element, Vec
      # element, Option payload, enum payload, match binding, method receiver,
      # generic instance, io.out). Each generated program checks itself.
      - name: Feature matrix (every type through every context)
        run: sh scripts/matrix.sh elf64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: mvs-linux-x86_64
          path: |
            mvs
            std/
            core/

  # Memory safety of the COMPILER ITSELF: build with AddressSanitizer +
  # UndefinedBehaviorSanitizer, run the whole suite under it, then fuzz with
  # mutated sources, token soup, and deep-nesting stress. Any signal or
  # sanitizer report is a compiler bug. Leak detection is off on purpose: the
  # compiler is a short-lived process that never frees its AST.
  sanitize-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build with ASan + UBSan
        run: gcc -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Isrc src/main.c src/lexer.c src/ast.c src/parser.c src/module.c src/generic.c src/diag.c src/codegen.c src/arch/common.c src/arch/x86_64/win.c src/arch/x86_64/sysv.c src/arch/arm64/linux.c -o mvs_asan

      - name: Run the test suite under the sanitizers
        run: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 ./mvs_asan test
        env:
          MVS_STD: std
          MVS_CORE: core

      - name: Fuzz the compiler under the sanitizers
        run: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=print_stacktrace=1 MVS=./mvs_asan sh scripts/fuzz.sh 400

  # AArch64 target: cross-compile every runnable example with --target arm64,
  # link with the cross gcc, RUN under qemu-aarch64, and diff stdout against
  # the same goldens as win64/elf64 (three ABIs, one behavior)
  test-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cross toolchain + qemu
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: Build compiler (native Linux)
        run: gcc -Wall -Wextra -Werror -Isrc src/main.c src/lexer.c src/ast.c src/parser.c src/module.c src/generic.c src/diag.c src/codegen.c src/arch/common.c src/arch/x86_64/win.c src/arch/x86_64/sysv.c src/arch/arm64/linux.c -o mvs

      - name: Run ARM64 test suite (compile, cross-link, run under qemu, diff goldens)
        run: sh scripts/test_arm64_ci.sh

      # the same differential check on AArch64: both sides cross-compiled,
      # both run under qemu, output must match the C reference exactly
      - name: Differential test against the C reference (AArch64)
        run: sh scripts/difftest.sh arm64

      - name: Feature matrix on AArch64
        run: sh scripts/matrix.sh arm64
