name: ARM64

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and qemu
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: Build compiler (native Linux)
        run: gcc -Wall -Wextra -Werror -Isrc src/main.c src/lexer.c src/ast.c src/parser.c src/module.c src/generic.c src/diag.c src/codegen.c src/ir.c src/lower.c src/opt.c src/arch/common.c src/arch/x86_64/win.c src/arch/x86_64/sysv.c src/arch/arm64/linux.c -o mvs

      - name: Run ARM64 test suite (compile, cross-link, run under qemu, diff goldens)
        run: sh scripts/test_arm64_ci.sh

      - name: Differential test against the C reference (AArch64)
        run: sh scripts/difftest.sh arm64

      - name: Feature matrix on AArch64
        run: sh scripts/matrix.sh arm64

      - name: Feature matrix 2 on AArch64
        run: sh scripts/matrix_features.sh arm64

      - name: Module matrix on AArch64
        run: sh scripts/matrix_modules.sh arm64
