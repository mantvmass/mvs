name: Feature Request
description: Suggest a language feature, stdlib addition, or tooling improvement
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: How the feature would look in MVS code
      render: text

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful? What problem does it solve?
