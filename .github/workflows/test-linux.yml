name: Linux

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build compiler (gcc, warnings are errors)
        run: gcc -Wall -Wextra -Werror -Isrc src/main.c src/lexer.c src/ast.c src/parser.c src/module.c src/generic.c src/diag.c src/codegen.c src/ir.c src/lower.c src/opt.c src/arch/common.c src/arch/x86_64/win.c src/arch/x86_64/sysv.c src/arch/arm64/linux.c -o mvs

      - name: Run ELF64 test suite (compile, link, run, diff goldens)
        run: sh scripts/test_elf_ci.sh

      - name: Run built-in runner (mvs test)
        run: ./mvs test

      - name: Differential test against the C reference
        run: sh scripts/difftest.sh elf64

      - name: Feature matrix (every type through every context)
        run: sh scripts/matrix.sh elf64

      - name: Feature matrix (traits, function pointers, generics, flow)
        run: sh scripts/matrix_features.sh elf64

      - name: Module matrix (import forms, conditional compilation)
        run: sh scripts/matrix_modules.sh elf64

      - name: std and core API coverage
        run: python3 scripts/api_coverage.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mvs-linux-x86_64
          path: |
            mvs
            std/
            core/
